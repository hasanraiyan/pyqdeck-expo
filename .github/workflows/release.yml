name: Build Android Release

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build format'
        required: true
        default: 'aab'
        type: choice
        options:
          - aab
          - apk
          - both

jobs:
  build:
    name: Build Android (${{ github.run_number }})
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 🟢 Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔢 Auto-increment Android versionCode
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            app.expo.android = app.expo.android || {};
            app.expo.android.versionCode = parseInt(process.env.BUILD_NUMBER || '1');
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2));
            console.log('Set android.versionCode to:', app.expo.android.versionCode);
          "

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🚀 Prebuild Android project
        run: npx expo prebuild --platform android --clean

      - name: 🔐 Setup Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            echo "Release keystore decoded."
            
            # Map Gradle signing properties
            echo "" >> android/gradle.properties
            echo "MYAPP_UPLOAD_STORE_FILE=release.keystore" >> android/gradle.properties
            echo "MYAPP_UPLOAD_KEY_ALIAS=$KEY_ALIAS" >> android/gradle.properties
            echo "MYAPP_UPLOAD_STORE_PASSWORD=$KEYSTORE_PASSWORD" >> android/gradle.properties
            echo "MYAPP_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD" >> android/gradle.properties

            # Configure build.gradle with release signingConfig
            node -e "
              const fs = require('fs');
              const file = 'android/app/build.gradle';
              let lines = fs.readFileSync(file, 'utf8').split('\n');
              let out = [];
              for (let line of lines) {
                out.push(line);
                if (line.trim() === 'signingConfigs {') {
                  out.push('        release {');
                  out.push('            if (project.hasProperty(\"MYAPP_UPLOAD_STORE_FILE\")) {');
                  out.push('                storeFile file(MYAPP_UPLOAD_STORE_FILE)');
                  out.push('                storePassword MYAPP_UPLOAD_STORE_PASSWORD');
                  out.push('                keyAlias MYAPP_UPLOAD_KEY_ALIAS');
                  out.push('                keyPassword MYAPP_UPLOAD_KEY_PASSWORD');
                  out.push('            }');
                  out.push('        }');
                }
              }
              let content = out.join('\n');
              content = content.replace(/(buildTypes\s*\{[\s\S]*?release\s*\{[\s\S]*?signingConfig\s+)signingConfigs\.[a-zA-Z0-9_]+/, '\$1signingConfigs.release');
              fs.writeFileSync(file, content);
              console.log('Successfully configured release signing in android/app/build.gradle');
            "
          fi

      - name: 🔨 Build Release APK & AAB
        working-directory: android
        run: |
          BUILD_CHOICE="${{ github.event.inputs.build_type }}"
          if [ "$BUILD_CHOICE" = "apk" ]; then
            ./gradlew assembleRelease --no-daemon
          elif [ "$BUILD_CHOICE" = "aab" ]; then
            ./gradlew bundleRelease --no-daemon
          else
            ./gradlew assembleRelease bundleRelease --no-daemon
          fi

      - name: 📤 Upload Release APK
        if: github.event.inputs.build_type != 'aab'
        uses: actions/upload-artifact@v4
        with:
          name: pyqdeck-v${{ github.run_number }}-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: 📤 Upload Release AAB (Play Store)
        if: github.event.inputs.build_type != 'apk'
        uses: actions/upload-artifact@v4
        with:
          name: pyqdeck-v${{ github.run_number }}-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 14
