name: Build PYQDeck Android (0 EAS Minutes)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Select Build Type to generate'
        required: true
        default: 'preview-apk'
        type: choice
        options:
          - 'preview-apk'       # Standalone Release APK for direct installation
          - 'debug-apk'         # Debug APK with developer tools
          - 'production-aab'    # Google Play Store Bundle (.aab)
          - 'all'               # Generates both Release APK and Play Store AAB

jobs:
  build-android:
    name: Build Android (${{ github.event.inputs.build_type }})
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 📥 Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: 🔍 Typecheck Project
        run: pnpm tsc --noEmit

      - name: ⚙️ Expo Prebuild (Generate Android Project)
        run: npx expo prebuild --platform android --clean

      - name: 🔨 Compile Android Artifacts
        working-directory: android
        run: |
          chmod +x ./gradlew
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          
          if [ "$BUILD_TYPE" = "preview-apk" ]; then
            echo "Compiling Release APK..."
            ./gradlew assembleRelease --no-daemon
          elif [ "$BUILD_TYPE" = "debug-apk" ]; then
            echo "Compiling Debug APK..."
            ./gradlew assembleDebug --no-daemon
          elif [ "$BUILD_TYPE" = "production-aab" ]; then
            echo "Compiling Production AAB..."
            ./gradlew bundleRelease --no-daemon
          elif [ "$BUILD_TYPE" = "all" ]; then
            echo "Compiling both Release APK and Production AAB..."
            ./gradlew assembleRelease bundleRelease --no-daemon
          fi

      - name: 📤 Upload Release APK
        if: ${{ github.event.inputs.build_type == 'preview-apk' || github.event.inputs.build_type == 'all' }}
        uses: actions/upload-artifact@v4
        with:
          name: pyqdeck-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: 📤 Upload Debug APK
        if: ${{ github.event.inputs.build_type == 'debug-apk' }}
        uses: actions/upload-artifact@v4
        with:
          name: pyqdeck-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: 📤 Upload Production AAB
        if: ${{ github.event.inputs.build_type == 'production-aab' || github.event.inputs.build_type == 'all' }}
        uses: actions/upload-artifact@v4
        with:
          name: pyqdeck-production-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
