plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.pyqtextrecognition'
version = '1.0.0'

android {
  namespace "expo.modules.pyqtextrecognition"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Unbundled ML Kit: the Latin text model is downloaded and shared by Google Play
  // Services instead of being packaged in the app (saves ~5 MB per download).
  implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.1'
}
